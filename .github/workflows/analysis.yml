name: Run Healthcare Analysis

on:
  push:
    branches:
      - feature/healthcare-satisfaction-analysis
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: pip install pandas matplotlib

      - name: Run analysis
        run: python feature/healthcare-satisfaction-analysis/analysis.py

